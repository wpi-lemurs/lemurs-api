server {
    listen 80;
    client_max_body_size 20M;
    
    location /web/ {
        proxy_pass http://lemurs-web:80/;
    }

    location /api/ {
        proxy_pass http://lemurs-api:8080/;
    }

    location /dashboard/ {
        proxy_pass http://lemurs-dashboard:5433/;
    }
    
    location / {
        return 301 /web$request_uri;
    }
}